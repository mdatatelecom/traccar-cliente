name: Gerar APK Personalizado

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Resolve o aviso do GitHub
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace # Mostra o erro detalhado se falhar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grs-Gps-App
          path: app/build/outputs/apk/debug/app-debug.apk
